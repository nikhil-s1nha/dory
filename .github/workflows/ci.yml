name: CI

# `main` is a single empty root commit and stays that way (see CLAUDE.md) — all work happens on
# `expoApproach` and the short-lived branches that merge into it. Triggering only on `main` meant
# CI had never once run against real code while claiming, in the README, to run on every push.
on:
  push:
    branches:
      - main
      - expoApproach
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches: [main, expoApproach]

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
